<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>손가락 개수 세기 · HandLandmarker</title>
<style>
  :root {
    --bg: #0b0c14;
    --panel: #171825;
    --text: #eef0f4;
    --sub: #9aa0ac;
    --accent: #7fd1ff;
    color-scheme: dark;
  }
  * { box-sizing: border-box; }
  html, body {
    margin: 0; padding: 0; height: 100%;
    background: var(--bg);
    color: var(--text);
    font-family: "Segoe UI", "Apple SD Gothic Neo", "Malgun Gothic", sans-serif;
    overflow-x: hidden;
  }

  header {
    padding: 14px 20px;
    display: flex; align-items: center; justify-content: space-between;
    flex-wrap: wrap; gap: 10px;
    background: rgba(0,0,0,0.25);
    border-bottom: 1px solid rgba(127,209,255,0.15);
  }
  header h1 {
    font-size: 17px; margin: 0; font-weight: 700;
    letter-spacing: 0.5px;
    background: linear-gradient(90deg, #7fd1ff, #b388ff, #7fd1ff);
    -webkit-background-clip: text; background-clip: text; color: transparent;
  }
  header .controls { display: flex; align-items: center; gap: 16px; font-size: 13px; color: var(--sub); }
  header label { display: flex; align-items: center; gap: 6px; cursor: pointer; user-select: none; }

  main {
    display: flex; flex-direction: column; align-items: center;
    padding: 20px; gap: 16px;
  }

  #stage {
    position: relative;
    width: min(90vw, 720px);
    aspect-ratio: 4 / 3;
    background: #000;
    border-radius: 12px;
    overflow: hidden;
    box-shadow: 0 8px 30px rgba(0,0,0,0.5), 0 0 40px rgba(127,209,255,0.08);
  }
  #mirrorWrap {
    position: absolute; inset: 0;
    transform: scaleX(-1); /* 셀피 뷰처럼 좌우 반전 */
  }
  video, canvas#overlay {
    position: absolute; inset: 0;
    width: 100%; height: 100%;
    object-fit: cover;
  }
  video { background: #000; }
  canvas#overlay { pointer-events: none; }

  #statusBanner {
    position: absolute; inset: 0;
    display: flex; align-items: center; justify-content: center;
    text-align: center; padding: 30px;
    background: rgba(0,0,0,0.8);
    font-size: 15px; line-height: 1.6;
    z-index: 20;
  }
  #statusBanner.hidden { display: none; }
  #statusBanner button {
    margin-top: 14px;
    padding: 8px 18px;
    border-radius: 8px;
    border: none;
    background: var(--accent);
    color: #051826;
    font-weight: 700;
    cursor: pointer;
  }

  /* 큰 숫자 표시판 */
  #countPanel {
    width: min(90vw, 720px);
    display: flex; flex-direction: column; align-items: center;
    background: var(--panel);
    border-radius: 14px;
    padding: 18px 16px 22px;
  }
  #countLabel {
    font-size: 13px;
    color: var(--sub);
    letter-spacing: 2px;
    margin-bottom: 4px;
  }
  #countNumber {
    font-size: clamp(72px, 20vw, 160px);
    font-weight: 900;
    line-height: 1;
    color: var(--accent);
    text-shadow: 0 0 18px rgba(127,209,255,0.55), 0 0 50px rgba(127,209,255,0.25);
  }
  #countNumber.pop { animation: countPop 0.28s ease; }
  @keyframes countPop {
    0%   { transform: scale(1); }
    35%  { transform: scale(1.28); }
    100% { transform: scale(1); }
  }
  #countNumber.reset { animation: countReset 0.5s ease; }
  @keyframes countReset {
    0%   { transform: scale(1.15) rotate(0deg); color: #ff8a8a; text-shadow: 0 0 30px rgba(255,90,90,0.8); }
    60%  { transform: scale(0.85) rotate(-4deg); }
    100% { transform: scale(1) rotate(0deg); color: var(--accent); text-shadow: 0 0 18px rgba(127,209,255,0.55); }
  }
  #handsDetected {
    margin-top: 6px;
    font-size: 12px;
    color: var(--sub);
  }

  footer {
    color: var(--sub);
    font-size: 12px;
    text-align: center;
    padding: 6px 20px 24px;
    max-width: 720px;
  }
</style>
</head>
<body>

<header>
  <h1>🖐️ 손가락 개수 세기 (MediaPipe HandLandmarker)</h1>
  <div class="controls">
    <label><input type="checkbox" id="toggleLandmarks" checked /> 랜드마크 디버그 오버레이</label>
    <label><input type="checkbox" id="toggleSound" /> 🔊 사운드 (클릭으로 활성화)</label>
  </div>
</header>

<main>
  <div id="stage">
    <div id="mirrorWrap">
      <video id="video" autoplay muted playsinline></video>
      <canvas id="overlay"></canvas>
    </div>
    <div id="statusBanner">
      <div>
        <div id="statusText">카메라 권한을 요청할 준비 중입니다…</div>
        <button id="retryBtn" style="display:none;">다시 시도</button>
      </div>
    </div>
  </div>

  <div id="countPanel">
    <div id="countLabel">펴진 손가락 개수</div>
    <div id="countNumber">0</div>
    <div id="handsDetected">인식된 손: 0개</div>
  </div>

  <footer>
    손가락을 펴서 개수를 화면에 보여주세요 (최대 두 손, 10개까지).
    양손을 전부 활짝 펴서 10개를 보여주면 숫자가 0으로 리셋됩니다.
    숫자가 바뀔 때마다 짧은 효과음이 울립니다.
  </footer>
</main>

<script type="module">
import {
  HandLandmarker,
  FilesetResolver,
} from "https://cdn.jsdelivr.net/npm/@mediapipe/tasks-vision@latest/vision_bundle.mjs";

// ------------------------------------------------------------------
// 상수 설정
// ------------------------------------------------------------------
const HOLD_FRAMES_REQUIRED = 6; // 같은 개수가 연속으로 감지되어야 확정으로 인정

// MediaPipe Hands 21개 랜드마크 연결선 (손가락 뼈대)
const HAND_CONNECTIONS = [
  [0,1],[1,2],[2,3],[3,4],          // 엄지
  [0,5],[5,6],[6,7],[7,8],          // 검지
  [5,9],[9,10],[10,11],[11,12],     // 중지
  [9,13],[13,14],[14,15],[15,16],   // 약지
  [13,17],[17,18],[18,19],[19,20],  // 소지
  [0,17],                           // 손바닥 하단
];

// ------------------------------------------------------------------
// DOM 참조
// ------------------------------------------------------------------
const video = document.getElementById("video");
const overlay = document.getElementById("overlay");
const overlayCtx = overlay.getContext("2d");
const statusBanner = document.getElementById("statusBanner");
const statusText = document.getElementById("statusText");
const retryBtn = document.getElementById("retryBtn");
const toggleLandmarksEl = document.getElementById("toggleLandmarks");
const toggleSoundEl = document.getElementById("toggleSound");
const countNumberEl = document.getElementById("countNumber");
const handsDetectedEl = document.getElementById("handsDetected");

// ------------------------------------------------------------------
// 손가락 펴짐 판별 유틸 (손목 기준 거리 비교 - 손 회전에 비교적 강건)
// ------------------------------------------------------------------
function dist(a, b) {
  return Math.hypot(a.x - b.x, a.y - b.y);
}

function isFingerExtended(lm, tipIdx, pipIdx) {
  const wrist = lm[0];
  return dist(lm[tipIdx], wrist) > dist(lm[pipIdx], wrist) * 1.05;
}

function isThumbExtended(lm) {
  // 엄지는 세로 움직임이 아니라 옆으로 벌어지므로 소지 MCP 기준 거리로 판별
  const pinkyMcp = lm[17];
  return dist(lm[4], pinkyMcp) > dist(lm[2], pinkyMcp);
}

// 손 하나의 랜드마크 21개 -> 펴진 손가락 개수 (0~5)
function countExtendedFingers(lm) {
  let n = 0;
  if (isThumbExtended(lm)) n++;
  if (isFingerExtended(lm, 8, 6)) n++;
  if (isFingerExtended(lm, 12, 10)) n++;
  if (isFingerExtended(lm, 16, 14)) n++;
  if (isFingerExtended(lm, 20, 18)) n++;
  return n;
}

// ------------------------------------------------------------------
// 개수 안정화(디바운스) + 리셋 상태
// ------------------------------------------------------------------
let currentRawCount = -1;
let holdFrames = 0;
let streakTriggered = false;
let displayedCount = 0;

function setDisplayedNumber(n, animClass) {
  countNumberEl.textContent = String(n);
  countNumberEl.classList.remove("pop", "reset");
  void countNumberEl.offsetWidth; // 애니메이션 재시작을 위한 reflow
  countNumberEl.classList.add(animClass);
}

function processCount(rawCount, handsSeen) {
  handsDetectedEl.textContent = `인식된 손: ${handsSeen}개`;

  if (rawCount === currentRawCount) {
    holdFrames++;
  } else {
    currentRawCount = rawCount;
    holdFrames = 1;
    streakTriggered = false;
  }

  if (holdFrames >= HOLD_FRAMES_REQUIRED && !streakTriggered) {
    streakTriggered = true;

    if (currentRawCount === 10) {
      // 양손 전부 펼치면 리셋
      displayedCount = 0;
      setDisplayedNumber(0, "reset");
      playResetSound();
    } else if (currentRawCount !== displayedCount) {
      displayedCount = currentRawCount;
      setDisplayedNumber(displayedCount, "pop");
      playTickSound(displayedCount);
    }
  }
}

// ------------------------------------------------------------------
// 사운드: Web Audio API로 직접 합성 (파일 불필요, 항상 재생 보장)
// 숫자가 바뀔 때 짧은 "띡" 소리, 리셋될 때 살짝 다른 "스윽" 소리
// ------------------------------------------------------------------
let audioCtx = null;
let soundEnabled = false;

function ensureAudioContext() {
  if (!audioCtx) {
    const Ctx = window.AudioContext || window.webkitAudioContext;
    audioCtx = new Ctx();
  }
  if (audioCtx.state === "suspended") audioCtx.resume();
  return audioCtx;
}

toggleSoundEl.addEventListener("change", () => {
  soundEnabled = toggleSoundEl.checked;
  if (soundEnabled) ensureAudioContext();
});

function playTickSound(count) {
  if (!soundEnabled || !audioCtx) return;
  const ctx = audioCtx;
  const t0 = ctx.currentTime;
  const osc = ctx.createOscillator();
  osc.type = "sine";
  osc.frequency.value = 420 + count * 35; // 개수가 많을수록 살짝 음이 높아짐
  const gain = ctx.createGain();
  gain.gain.setValueAtTime(0.0001, t0);
  gain.gain.exponentialRampToValueAtTime(0.5, t0 + 0.015);
  gain.gain.exponentialRampToValueAtTime(0.0001, t0 + 0.16);
  osc.connect(gain).connect(ctx.destination);
  osc.start(t0);
  osc.stop(t0 + 0.18);
}

function playResetSound() {
  if (!soundEnabled || !audioCtx) return;
  const ctx = audioCtx;
  const t0 = ctx.currentTime;
  const osc = ctx.createOscillator();
  osc.type = "triangle";
  osc.frequency.setValueAtTime(900, t0);
  osc.frequency.exponentialRampToValueAtTime(220, t0 + 0.3);
  const gain = ctx.createGain();
  gain.gain.setValueAtTime(0.0001, t0);
  gain.gain.exponentialRampToValueAtTime(0.5, t0 + 0.02);
  gain.gain.exponentialRampToValueAtTime(0.0001, t0 + 0.35);
  osc.connect(gain).connect(ctx.destination);
  osc.start(t0);
  osc.stop(t0 + 0.4);
}

// ------------------------------------------------------------------
// 랜드마크 디버그 오버레이 그리기
// ------------------------------------------------------------------
function drawLandmarks(landmarksList) {
  overlayCtx.clearRect(0, 0, overlay.width, overlay.height);
  if (!toggleLandmarksEl.checked) return;

  for (const lm of landmarksList) {
    overlayCtx.strokeStyle = "#7fd1ff";
    overlayCtx.lineWidth = 2;
    for (const [a, b] of HAND_CONNECTIONS) {
      const pa = lm[a], pb = lm[b];
      overlayCtx.beginPath();
      overlayCtx.moveTo(pa.x * overlay.width, pa.y * overlay.height);
      overlayCtx.lineTo(pb.x * overlay.width, pb.y * overlay.height);
      overlayCtx.stroke();
    }
    overlayCtx.fillStyle = "#ffd740";
    for (const pt of lm) {
      overlayCtx.beginPath();
      overlayCtx.arc(pt.x * overlay.width, pt.y * overlay.height, 4, 0, Math.PI * 2);
      overlayCtx.fill();
    }
  }
}

// ------------------------------------------------------------------
// 초기화: 카메라 권한 요청 -> 모델 로드 -> 추론 루프
// ------------------------------------------------------------------
let handLandmarker = null;

function setStatus(msg, showRetry = false) {
  statusBanner.classList.remove("hidden");
  statusText.textContent = msg;
  retryBtn.style.display = showRetry ? "inline-block" : "none";
}

function hideStatus() {
  statusBanner.classList.add("hidden");
}

async function requestCamera() {
  setStatus("카메라 권한을 요청 중입니다…");
  try {
    const stream = await navigator.mediaDevices.getUserMedia({
      video: { width: 640, height: 480, facingMode: "user" },
      audio: false,
    });
    video.srcObject = stream;
    await new Promise((resolve) => {
      video.onloadedmetadata = () => {
        video.play();
        resolve();
      };
    });
    overlay.width = video.videoWidth;
    overlay.height = video.videoHeight;
    return true;
  } catch (err) {
    console.error(err);
    let msg = "카메라에 접근할 수 없습니다.";
    if (err.name === "NotAllowedError" || err.name === "PermissionDeniedError") {
      msg = "카메라 권한이 거부되었습니다.\n브라우저 주소창 옆의 카메라 아이콘 또는 사이트 설정에서 권한을 허용한 뒤 다시 시도해주세요.";
    } else if (err.name === "NotFoundError" || err.name === "DevicesNotFoundError") {
      msg = "사용 가능한 카메라 장치를 찾을 수 없습니다.\n웹캠이 연결되어 있는지 확인해주세요.";
    } else if (err.name === "NotReadableError") {
      msg = "카메라를 다른 프로그램이 사용 중이라 접근할 수 없습니다.\n다른 앱을 종료한 뒤 다시 시도해주세요.";
    }
    setStatus(msg, true);
    return false;
  }
}

async function loadModel() {
  setStatus("손 인식 모델을 불러오는 중입니다…");
  const vision = await FilesetResolver.forVisionTasks(
    "https://cdn.jsdelivr.net/npm/@mediapipe/tasks-vision@latest/wasm"
  );
  handLandmarker = await HandLandmarker.createFromOptions(vision, {
    baseOptions: {
      modelAssetPath:
        "https://storage.googleapis.com/mediapipe-models/hand_landmarker/hand_landmarker/float16/1/hand_landmarker.task",
      delegate: "GPU",
    },
    runningMode: "VIDEO",
    numHands: 2,
  });
}

function predictLoop() {
  const nowMs = performance.now();

  if (video.readyState >= 2 && handLandmarker) {
    const result = handLandmarker.detectForVideo(video, nowMs);
    const hands = result.landmarks || [];

    drawLandmarks(hands);

    let total = 0;
    for (const lm of hands) total += countExtendedFingers(lm);
    processCount(total, hands.length);
  }

  requestAnimationFrame(predictLoop);
}

async function init() {
  const ok = await requestCamera();
  if (!ok) return;

  try {
    await loadModel();
  } catch (err) {
    console.error(err);
    setStatus("모델을 불러오는 데 실패했습니다. 인터넷 연결을 확인한 뒤 다시 시도해주세요.", true);
    return;
  }

  hideStatus();
  requestAnimationFrame(predictLoop);
}

retryBtn.addEventListener("click", () => {
  hideStatus();
  init();
});

init();
</script>
</body>
</html>
